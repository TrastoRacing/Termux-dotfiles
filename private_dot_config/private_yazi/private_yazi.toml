# ~/.config/yazi/yazi.toml
# Configuración personalizada de Yazi optimizada para Termux / Android

[mgr]
show_hidden = false
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
ratio = [1, 3, 4]

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 80
image_delay = 30

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', block = true, desc = "Neovim" },
]
open = [
    { run = 'termux-open "$1"', orphan = true, desc = "Abrir en Android" },
]
play = [
    { run = 'termux-open "$1"', orphan = true, desc = "Reproducir en Android" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { mime = "application/javascript", use = "edit" },
    { mime = "video/*", use = [ "play", "open" ] },
    { mime = "audio/*", use = [ "play", "open" ] },
    { mime = "image/*", use = "open" },
    { mime = "application/pdf", use = "open" },
]
