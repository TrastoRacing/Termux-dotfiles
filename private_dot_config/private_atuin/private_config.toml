# ~/.config/atuin/config.toml
# Configuración personalizada de Atuin optimizada para Termux / tablet

style = "compact"
inline_height = 20
show_preview = true
search_mode = "fuzzy"
filter_mode = "global"
enter_accept = true
update_check = false
show_help = true
secrets_filter = true

# Filtro extra para no registrar variables de entorno sensibles
history_filter = [
    "^export .*(TOKEN|SECRET|KEY|PASSWORD|AUTH)=",
    "^unset .*(TOKEN|SECRET|KEY|PASSWORD|AUTH)",
]
