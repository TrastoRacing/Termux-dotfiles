# =============================================================================
# ~/.tmux.conf
# Configuración moderna de Tmux optimizada para Termux / Android Tablet
# Estética: Tokyo Night | Navegación táctil y teclado | Integración Neovim & Yazi
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Prefijo y Teclas Principales
# -----------------------------------------------------------------------------
# Prefijo principal: Ctrl+a (mucho más cómodo y accesible en teclado táctil/móvil)
set -g prefix C-a
bind C-a send-prefix

# Prefijo secundario: Ctrl+b (mantiene compatibilidad estándar)
set -g prefix2 C-b
bind C-b send-prefix -2

# Recarga rápida de configuración con <Prefijo> + r
bind r source-file ~/.tmux.conf \; display-message "¡Configuración de Tmux recargada!"

# -----------------------------------------------------------------------------
# 2. Rendimiento y Compatibilidad con Neovim
# -----------------------------------------------------------------------------
# Eliminar el retraso molesto al pulsar la tecla Esc en Neovim
set -s escape-time 10

# Soporte completo de colores RGB / True Color de 24 bits
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Soporte para gráficos y previsualización de imágenes en Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Aumentar búfer del historial de scrollback
set -g history-limit 10000

# -----------------------------------------------------------------------------
# 3. Soporte Táctil y Ratón (Tablet Friendly)
# -----------------------------------------------------------------------------
# Permite tocar la pantalla para cambiar de panel, arrastrar bordes para
# redimensionar, tocar pestañas de ventana y hacer scroll táctil en el historial.
set -g mouse on

# -----------------------------------------------------------------------------
# 4. Numeración Intuitiva de Ventanas y Paneles (Empieza en 1)
# -----------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# 5. División de Paneles y Nuevas Ventanas (Conservando la ruta actual PWD)
# -----------------------------------------------------------------------------
# Dividir verticalmente (columnas lado a lado):
# Usa 'v' (fácil en teclado físico), o '|', '\', '%'
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Dividir horizontalmente (filas arriba y abajo):
# Usa 's' o '-' (fáciles en teclado físico), o '_', '"'
bind s split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Navegación rápida directa entre paneles con Alt + Flechas (sin usar prefijo)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Zoom / Maximizar panel actual al 100% (y volver al tamaño anterior): Prefijo + z
bind z resize-pane -Z

# Crear nueva ventana manteniendo la ruta actual
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# 6. Navegación entre Paneles estilo Vim (h, j, k, l)
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles con teclas direccionales (en pasos de 5 celdas)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# 7. Modo Copia y Portapapeles de Android (Termux-API)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "termux-clipboard-set"

# -----------------------------------------------------------------------------
# 8. Tema Visual: Tokyo Night
# -----------------------------------------------------------------------------
# Barra de estado general
set -g status on
set -g status-interval 3
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Bordes de paneles
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Indicador de comandos activos / mensajes
set -g message-style "bg=#7aa2f7,fg=#15161e,bold"
set -g message-command-style "bg=#bb9af7,fg=#15161e,bold"

# Lado izquierdo: Nombre de la sesión activa
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold] #S #[bg=#1a1b26,fg=#7aa2f7] "

# Formato de ventanas inactivas
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I: #W "
set -g window-status-separator ""

# Formato de la ventana activa actual
set -g window-status-current-format "#[fg=#7dcfff,bg=#292e42,bold] #I: #W #[default]"

# Lado derecho: Hora y estado
set -g status-right-length 50
set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#bb9af7,bg=#1a1b26,bold] %H:%M #[fg=#7aa2f7,bg=#1a1b26] %d-%b "
